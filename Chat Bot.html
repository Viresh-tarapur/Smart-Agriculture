<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Farmer's Assistant ChatBot</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.3.1/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
body {
    background-color:#f5f5f5;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
.container {
    max-width:800px;
    background:white;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,.1);
    padding:25px;
    margin:30px auto;
}
h2 {
    color:#2e7d32;
    text-align:center;
    font-weight:bold;
}
.chat-container {
    height:400px;
    overflow-y:auto;
    border:1px solid #ddd;
    border-radius:8px;
    padding:15px;
    background:#f9f9f9;
    margin-bottom:15px;
}
.message {
    margin-bottom:15px;
    padding:10px 15px;
    border-radius:18px;
    max-width:80%;
}
.user-message {
    background:#e3f2fd;
    margin-left:auto;
}
.bot-message {
    background:#f1f8e9;
}
.loading {
    text-align:center;
    font-style:italic;
}
.time-stamp {
    font-size:.75em;
    color:#777;
    text-align:right;
}
#sendBtn {
    background:#2e7d32;
    color:white;
}
.suggestion-btn {
    background:#e8f5e9;
    border:1px solid #c8e6c9;
    color:#2e7d32;
    border-radius:20px;
    padding:5px 15px;
    margin:5px;
    cursor:pointer;
}
.voice-active {
    background:#ffeb3b !important;
}
</style>
</head>

<body>
<div class="container">
    <h2><i class="fas fa-tractor"></i> Farmer's Assistant</h2>

    <div>
        <button class="suggestion-btn" onclick="insertSuggestion('How to treat leaf rust in wheat?')">Leaf Rust</button>
        <button class="suggestion-btn" onclick="insertSuggestion('Best irrigation practices for rice?')">Rice Irrigation</button>
        <button class="suggestion-btn" onclick="insertSuggestion('Organic pest control methods?')">Organic Pest Control</button>
        <button class="suggestion-btn" onclick="insertSuggestion('When to harvest corn?')">Corn Harvest</button>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="bot-message message">
            Hello farmer 🌾! How can I help you today?
            <div class="time-stamp"></div>
        </div>
    </div>

    <div class="input-group">
        <input id="userInput" class="form-control" placeholder="Ask about crops, pests, irrigation..." />
        <div class="input-group-append">
            <button class="btn btn-outline-secondary" id="voiceBtn" onclick="toggleVoiceInput()">
                <i class="fas fa-microphone"></i>
            </button>
            <button class="btn" id="sendBtn" onclick="sendMessage()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>

<script>
/* ================== VOICE ================== */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition, isListening=false;

if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.onstart = () => {
        isListening = true;
        voiceBtn.classList.add("voice-active");
    };
    recognition.onend = () => {
        isListening = false;
        voiceBtn.classList.remove("voice-active");
    };
    recognition.onresult = e => {
        userInput.value = e.results[0][0].transcript;
    };
}

function toggleVoiceInput(){
    if(!recognition) return alert("Voice not supported");
    isListening ? recognition.stop() : recognition.start();
}

/* ================== CHAT ================== */
let conversationHistory = [
    { role:"system", content:"You are an expert agricultural assistant. Give clear, practical farming advice." }
];

function timeNow(){
    return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function addMessage(content, type){
    const div = document.createElement("div");
    div.className = `${type}-message message`;
    div.innerHTML = content + `<div class="time-stamp">${timeNow()}</div>`;
    chatContainer.appendChild(div);
    chatContainer.scrollTop = chatContainer.scrollHeight;
}

function insertSuggestion(text){
    userInput.value = text;
    userInput.focus();
}

async function sendMessage(){
    const input = userInput.value.trim();
    if(!input) return;

    addMessage(input,"user");
    conversationHistory.push({role:"user", content:input});
    userInput.value = "";

    const loading = document.createElement("div");
    loading.className = "loading";
    loading.innerText = "Thinking...";
    chatContainer.appendChild(loading);

    try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions",{
            method:"POST",
            headers:{
                "Authorization":"Bearer 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",
                "Content-Type":"application/json",
                "HTTP-Referer":window.location.href,
                "X-Title":"Farmers Assistant"
            },
            body: JSON.stringify({
                model:"deepseek/deepseek-chat",
                messages:conversationHistory
            })
        });

        if(!response.ok) throw new Error("API error");

        const data = await response.json();
        loading.remove();

        const reply = data.choices[0].message.content;
        conversationHistory.push({role:"assistant", content:reply});
        addMessage(marked.parse(reply),"bot");

    } catch(err){
        loading.remove();
        addMessage("Error: Unable to fetch response","bot");
        console.error(err);
    }
}

userInput.addEventListener("keypress", e => {
    if(e.key==="Enter") sendMessage();
});
</script>
</body>
</html>
