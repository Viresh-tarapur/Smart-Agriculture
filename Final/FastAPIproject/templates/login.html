<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AgriTech</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a4a1a 0%, #2d7a2d 40%, #4CAF50 100%);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1950&q=80') center/cover;
            opacity: 0.15;
        }

        /* Floating shapes */
        .shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            animation: float 8s ease-in-out infinite;
        }
        .shape-1 { width: 300px; height: 300px; top: -80px; left: -80px; animation-delay: 0s; }
        .shape-2 { width: 200px; height: 200px; bottom: -50px; right: -50px; animation-delay: 3s; }
        .shape-3 { width: 150px; height: 150px; top: 50%; left: 10%; animation-delay: 1.5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 24px;
            padding: 50px 45px;
            width: 100%;
            max-width: 430px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #4CAF50, #2d7a2d);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 1.8rem;
            color: white;
            box-shadow: 0 8px 20px rgba(76, 175, 80, 0.4);
        }

        .brand h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1a4a1a;
        }

        .brand p {
            color: #666;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        h2 {
            font-size: 1.4rem;
            color: #1a4a1a;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #444;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #4CAF50;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 13px 15px 13px 42px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            color: #333;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
            background: #fafafa;
        }

        .form-group input:focus {
            border-color: #4CAF50;
            box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.12);
            background: #fff;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4CAF50, #2d7a2d);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 8px;
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.35);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(76, 175, 80, 0.45);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .error-msg {
            background: #fff0f0;
            border: 1px solid #ffcdd2;
            color: #c62828;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.88rem;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .footer-link {
            text-align: center;
            margin-top: 22px;
            font-size: 0.9rem;
            color: #666;
        }

        .footer-link a {
            color: #4CAF50;
            font-weight: 600;
            text-decoration: none;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: #bbb;
            font-size: 0.85rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>

    <div class="card">
        <div class="brand">
            <div class="brand-icon">
                <i class="fas fa-tractor"></i>
            </div>
            <h1>AgriTech</h1>
            <p>Smart Farming Solutions</p>
        </div>

        <h2>Welcome back 👋</h2>

        {% if error %}
        <div class="error-msg">
            <i class="fas fa-exclamation-circle"></i> {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
            </div>
            <button type="submit" class="btn-submit">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <div class="footer-link">
            Don't have an account? <a href="/register">Register here</a>
        </div>
        <div class="footer-link" style="margin-top: 10px;">
            <a href="/" style="color: #888; font-weight: 400;"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </div>
    </div>
</body>
</html>
