<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What to Grow | AI Crop Recommender</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface-color: #1a1d2d;
            --primary-accent: #10a37f;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --border-color: #374151;
            --input-bg: #1f2937;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Navigation */
        .top-nav {
            width: 100%;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            background-color: var(--surface-color);
            transition: background-color 0.2s; border: 1px solid var(--border-color);
        }

        .back-button:hover {
            background-color: #2d3748;
        }

        .chatgpt-badge {
            background-color: #10a37f;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 600;
            color: white;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Mode Toggle Switch */
        .mode-toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .toggle-label {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--input-bg);
            transition: .4s;
            border-radius: 34px;
            border: 1px solid var(--border-color);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary-accent);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        .mode-status {
            font-size: 0.8rem;
            color: var(--primary-accent);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 800px;
            padding: 2rem;
            margin: 0 auto;
        }

        /* Input Form Section */
        .input-section {
            background-color: var(--surface-color);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            margin-bottom: 2.5rem;
            border: 1px solid var(--border-color);
        }

        .input-section h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .input-section h2 i {color: var(--primary-accent);}

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-group label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .input-group input, .input-group select {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--primary-accent);
        }

        .input-group input:disabled, .input-group select:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            background-color: rgba(255, 255, 255, 0.02);
        }

        .submit-btn {
            background-color: var(--primary-accent);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 1.5rem;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover {
            background-color: #0d8a6a;
        }
        .submit-btn:active {
            transform: scale(0.98);
        }
        .submit-btn:disabled {
            background-color: #2d3748;
            cursor: not-allowed;
            opacity: 0.5;
        }

        /* AI Chat Result */
        .ai-response-container {
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .ai-response-container h3 {
            color: var(--primary-accent);
            margin-bottom: 1rem;
        }

        .ai-response-container p {
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .ai-response-container ul {
            margin-left: 1.5rem;
            margin-bottom: 1rem;
        }

        .ai-response-container li {
            margin-bottom: 0.5rem;
        }

        /* Real Chatbot UI */
        .chat-thread {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            margin-top: 20px;
        }

        .message-row {
            display: flex;
            width: 100%;
            gap: 12px;
            animation: fadeIn 0.4s ease forwards;
        }

        .message-row.user-row {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .user-avatar {
            background-color: #5436da;
            color: white;
        }

        .ai-avatar {
            background-color: var(--primary-accent);
            color: white;
        }

        .message-bubble {
            max-width: 85%;
            padding: 14px 20px;
            border-radius: 18px;
            font-size: 0.98rem;
            line-height: 1.65;
            position: relative;
            box-shadow: var(--shadow-md);
        }

        .user-bubble {
            background-color: var(--primary-accent);
            color: white;
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }

        .ai-bubble {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
            backdrop-filter: blur(8px);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Markdown Styling inside AI Bubbles */
        .ai-bubble h1, .ai-bubble h2, .ai-bubble h3 {
            color: var(--primary-accent);
            margin-top: 1.2rem;
            margin-bottom: 0.8rem;
            font-weight: 700;
            line-height: 1.3;
        }

        .ai-bubble h1 { font-size: 1.4rem; }
        .ai-bubble h2 { font-size: 1.2rem; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 5px; }
        .ai-bubble h3 { font-size: 1.1rem; }

        .ai-bubble p {
            margin-bottom: 0.8rem;
        }

        .ai-bubble ul, .ai-bubble ol {
            margin-left: 1.2rem;
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .ai-bubble li {
            position: relative;
            list-style: none;
            padding-left: 0.5rem;
        }

        .ai-bubble li::before {
            content: "•";
            color: var(--primary-accent);
            position: absolute;
            left: -1rem;
            font-weight: bold;
        }

        .ai-bubble hr {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin: 1.5rem 0;
        }

        .ai-bubble strong {
            color: #fff;
            font-weight: 600;
        }

        .ai-bubble em {
            color: var(--text-secondary);
            font-style: italic;
        }

        .message-meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 5px;
            display: flex;
            gap: 10px;
        }

        .user-row .message-meta {
            justify-content: flex-end;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 10px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: var(--text-secondary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* Results Section (ChatGPT Style) */
        .results-section {
            display: none; /* Hidden until form is submitted */
            width: 100%;
            padding-bottom: 4rem;
        }

        .crop-suggestion {
            margin-bottom: 3rem;
            animation: fadeIn 0.5s ease forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
            from { opacity: 0; transform: translateY(10px); }
        }

        .crop-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .crop-emoji {
            font-size: 1.8rem;
        }

        .crop-title {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .images-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        .images-grid img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
        }

        .why-suitable-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .bullet-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .bullet-list li {
            position: relative;
            padding-left: 1.5rem;
            color: #d1d5db;
            line-height: 1.6;
            font-size: 1rem;
        }

        .bullet-list li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--text-secondary);
            font-size: 1.2rem;
            line-height: 1.4;
        }

        .bullet-list strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .divider {
            height: 1px;
            background-color: var(--border-color);
            margin: 2rem 0;
            width: 100%;
        }

        /* Loading Spinner */
        .loader-container {
            display: none;
            justify-content: center;
            align-items: center;
            padding: 3rem;
            flex-direction: column;
            gap: 1rem;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--primary-accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Floating Input Bar (Bottom) */
        .floating-input {
            position: fixed;
            bottom: 25px;
            width: 90%;
            max-width: 800px;
            background: rgba(32, 33, 35, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            z-index: 100;
            display: none; /* Shows with results */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .floating-input:focus-within {
            transform: translateY(-2px);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
            border-color: var(--primary-accent);
        }

        .floating-input input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        .floating-input i {
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.2rem;
            transition: color 0.2s;
        }
        .floating-input i:hover {
            color: var(--primary-accent);
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <a href="{{ url_for('home_page') }}" class="back-button">
            <i class="fas fa-chevron-left"></i>
        </a>
        <div class="chatgpt-badge">AgriSense AI</div>
        <div style="width: 40px;"></div>
    </nav>

    <div class="container">
        <!-- Input Form -->
        <div class="input-section" id="formSection">
            <div class="mode-toggle-container">
                <div class="toggle-label">
                    <i class="fas fa-robot"></i> 
                    <span>Smart Analysis Mode</span>
                </div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <span class="mode-status" id="modeStatus">Manual</span>
                    <label class="switch">
                        <input type="checkbox" id="autoToggle" onchange="toggleMode()">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <h2 id="formTitle"><i class="fas fa-seedling"></i> Environmental Data Input</h2>
            <form id="recommendationForm">
                <div class="form-grid">
                    <div class="input-group">
                        <label>Location / Region</label>
                        <input type="text" id="location" placeholder="e.g., Punjab, Semi-arid region" required>
                    </div>
                    
                    <div class="input-group">
                        <label>Leaf Direction / Sun Exposure</label>
                        <select id="leafDirection" required>
                            <option value="" disabled selected>Select Exposure</option>
                            <option value="full-sun">Full Sun (South Facing)</option>
                            <option value="partial-shade">Partial Shade</option>
                            <option value="high-wind">High Wind Exposure</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Soil Sensor: Moisture (%)</label>
                        <input type="number" id="moisture" placeholder="e.g., 30" required>
                    </div>

                    <div class="input-group">
                        <label>Soil Sensor: pH Level</label>
                        <input type="number" step="0.1" id="ph" placeholder="e.g., 6.5" required>
                    </div>

                    <div class="input-group">
                        <label>Env Sensor: Temperature (°C)</label>
                        <input type="number" id="temp" placeholder="e.g., 32" required>
                    </div>
                    
                    <div class="input-group">
                        <label>Env Sensor: Humidity (%)</label>
                        <input type="number" id="humidity" placeholder="e.g., 45" required>
                    </div>
                </div>

                <button type="button" class="submit-btn" id="recommendBtn" onclick="generateRecommendations()">
                    <i class="fas fa-magic"></i> Analyze Data & Get Recommendations
                </button>
            </form>
        </div>

        <!-- Loading State -->
        <div class="loader-container" id="loader">
            <div class="spinner"></div>
            <p style="color: var(--text-secondary);">Analyzing sensor data and geographic parameters...</p>
        </div>

        <!-- Results Section -->
        <div class="results-section" id="resultsSection">
            <div id="chatThread" class="chat-thread">
                <!-- Messages will appear here -->
            </div>
            
            <div id="staticCrops" style="display: none;">
                <!-- Fallback content if needed -->
            </div>
        </div>
    </div>

    <!-- Floating Chat Input simulating ChatGPT reply box -->
    <div class="floating-input" id="floatingInput">
        <i class="fas fa-plus"></i>
        <input type="text" id="chatInput" placeholder="Ask about these crops..." onkeypress="if(event.key === 'Enter') sendChatMessage()">
        <i class="fas fa-microphone"></i>
        <i class="fas fa-paper-plane" onclick="sendChatMessage()" style="cursor: pointer;"></i>
    </div>

    <script>
        let isAutoMode = false;
        let chatHistory = [
            { role: "system", content: "You are an expert agronomist advisor. Based on sensor data (temp, humidity, moisture, pH) and location, recommend the best 3 crops to grow. Provide detailed reasoning for each. Format your response in clean markdown." }
        ];

        function toggleMode() {
            const toggle = document.getElementById('autoToggle');
            const status = document.getElementById('modeStatus');
            const formInputs = document.querySelectorAll('#recommendationForm input, #recommendationForm select');
            const submitBtn = document.getElementById('recommendBtn');

            isAutoMode = toggle.checked;
            
            if (isAutoMode) {
                status.textContent = "Auto";
                status.style.color = "var(--primary-accent)";
                
                const sensorData = JSON.parse(localStorage.getItem('latestSensorData'));
                const savedLocation = localStorage.getItem('userLocation');
                
                if (sensorData) {
                    if (sensorData.temp) document.getElementById('temp').value = Math.round(sensorData.temp);
                    if (sensorData.humidity) document.getElementById('humidity').value = Math.round(sensorData.humidity);
                    if (sensorData.moisture) document.getElementById('moisture').value = Math.round(sensorData.moisture / 10);
                }
                
                if (savedLocation) {
                    document.getElementById('location').value = savedLocation;
                } else {
                    document.getElementById('location').value = "Bengaluru, Karnataka, India";
                }

                if (!document.getElementById('leafDirection').value) {
                    document.getElementById('leafDirection').value = "full-sun";
                }
                
                if (!document.getElementById('ph').value) {
                    document.getElementById('ph').value = 6.8;
                }

                formInputs.forEach(input => input.disabled = true);
                submitBtn.disabled = true;
                
                generateRecommendations();
            } else {
                status.textContent = "Manual";
                status.style.color = "var(--text-secondary)";
                formInputs.forEach(input => input.disabled = false);
                submitBtn.disabled = false;
            }
        }

        async function fetchAIResponse(userPrompt) {
            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer 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",
                        "Content-Type": "application/json",
                        "HTTP-Referer": window.location.href,
                        "X-Title": "AgriSense AI Advisor"
                    },
                    body: JSON.stringify({
                        model: "deepseek/deepseek-chat",
                        messages: chatHistory.concat([{ role: "user", content: userPrompt }])
                    })
                });

                if (!response.ok) throw new Error("API call failed");
                const data = await response.json();
                const reply = data.choices[0].message.content;
                chatHistory.push({ role: "user", content: userPrompt });
                chatHistory.push({ role: "assistant", content: reply });
                return reply;
            } catch (err) {
                console.error("AI Error:", err);
                return null;
            }
        }

        function appendMessage(role, content) {
            const thread = document.getElementById('chatThread');
            const row = document.createElement('div');
            row.className = `message-row ${role === 'user' ? 'user-row' : 'ai-row'}`;
            
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const avatarHtml = `<div class="avatar ${role === 'user' ? 'user-avatar' : 'ai-avatar'}">
                <i class="fas ${role === 'user' ? 'fa-user' : 'fa-robot'}"></i>
            </div>`;

            const bubbleHtml = `<div class="message-bubble ${role === 'user' ? 'user-bubble' : 'ai-bubble'}">
                ${role === 'assistant' ? marked.parse(content) : content}
                <div class="message-meta">${timeStr}</div>
            </div>`;

            row.innerHTML = avatarHtml + bubbleHtml;
            thread.appendChild(row);
            
            // Auto scroll
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function showTyping() {
            const thread = document.getElementById('chatThread');
            const row = document.createElement('div');
            row.id = "typingIndicator";
            row.className = "message-row ai-row";
            row.innerHTML = `<div class="avatar ai-avatar"><i class="fas fa-robot"></i></div>
                <div class="message-bubble ai-bubble">
                    <div class="typing-indicator">
                        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                    </div>
                </div>`;
            thread.appendChild(row);
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function hideTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        async function generateRecommendations() {
            const form = document.getElementById('recommendationForm');
            if(!form.checkValidity() && !isAutoMode) {
                form.reportValidity();
                return;
            }

            const location = document.getElementById('location').value;
            const temp = document.getElementById('temp').value;
            const humidity = document.getElementById('humidity').value;
            const moisture = document.getElementById('moisture').value;
            const ph = document.getElementById('ph').value;
            const exposure = document.getElementById('leafDirection').value;

            document.getElementById('formSection').style.display = 'none';
            document.getElementById('loader').style.display = 'flex';

            const userPrompt = `I am at ${location}. 
            Environmental parameters: Temp ${temp}°C, Humidity ${humidity}%, Soil Moisture ${moisture}%, pH ${ph}, Exposure: ${exposure}. 
            What are the best 3 crops to grow here?`;

            // We add the user message to UI first
            appendMessage('user', userPrompt);

            const aiReply = await fetchAIResponse(userPrompt);

            document.getElementById('loader').style.display = 'none';
            document.getElementById('resultsSection').style.display = 'block';
            document.getElementById('floatingInput').style.display = 'flex';

            if (aiReply) {
                appendMessage('assistant', aiReply);
            } else {
                appendMessage('assistant', "I'm sorry, I'm having trouble connecting to my knowledge base. Please check your internet or try again later.");
            }
        }

        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            input.value = "";
            appendMessage('user', text);
            
            showTyping();
            const reply = await fetchAIResponse(text);
            hideTyping();

            if (reply) {
                appendMessage('assistant', reply);
            }
        }

        window.onload = function() {
            const sensorData = localStorage.getItem('latestSensorData');
            if (sensorData) {
                console.log("Ready for Smart Mode.");
            }
        };
    </script>
</body>
</html>
