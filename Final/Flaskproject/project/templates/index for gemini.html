<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plant Disease Information</title>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.3.1/css/bootstrap.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #ffffff;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            animation: fadeIn 0.5s ease-out;
        }

        .header h2 {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #2196F3, #00BCD4);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .detected-object {
            background: rgba(33, 150, 243, 0.1);
            padding: 1.5rem;
            border-radius: 15px;
            margin-bottom: 2rem;
            border: 1px solid rgba(33, 150, 243, 0.2);
            backdrop-filter: blur(10px);
            animation: slideIn 0.5s ease-out;
        }

        .detected-object strong {
            color: #2196F3;
            font-size: 1.2rem;
        }

        #objectName {
            color: #ffffff;
            font-weight: 500;
        }

        .chat-input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 1rem 1.5rem;
            color: white;
            width: 100%;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #2196F3;
            outline: none;
            box-shadow: 0 0 15px rgba(33, 150, 243, 0.3);
        }

        .btn-ask {
            background: linear-gradient(45deg, #2196F3, #00BCD4);
            border: none;
            border-radius: 25px;
            padding: 1rem 2rem;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 2rem;
        }

        .btn-ask:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.4);
        }

        #response {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 2rem;
            margin-top: 2rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeIn 0.5s ease-out;
        }

        #response h3 {
            color: #2196F3;
            font-size: 1.4rem;
            margin-bottom: 1rem;
        }

        #response p {
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        #response ul {
            padding-left: 1.5rem;
        }

        #response li {
            margin-bottom: 0.5rem;
            line-height: 1.6;
        }

        .loading {
            color: #2196F3;
            font-style: italic;
            text-align: center;
            padding: 1rem;
        }

        .error {
            color: #ff5252;
            background: rgba(255, 82, 82, 0.1);
            padding: 1rem;
            border-radius: 10px;
            margin: 1rem 0;
            text-align: center;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .header h2 {
                font-size: 2rem;
            }

            .detected-object {
                padding: 1rem;
            }

            #response {
                padding: 1rem;
            }
        }

        /* Navigation buttons */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2rem;
        }

        .nav-button {
            background: rgba(33, 150, 243, 0.2);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .nav-button:hover {
            background: rgba(33, 150, 243, 0.4);
            transform: translateY(-2px);
            color: white;
            text-decoration: none;
        }

        /* Enhanced Loading Animation */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: rgba(33, 150, 243, 0.05);
            border-radius: 15px;
            border: 1px solid rgba(33, 150, 243, 0.1);
            margin-bottom: 2rem;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(33, 150, 243, 0.1);
            border-radius: 50%;
            border-top: 5px solid #2196F3;
            animation: spin 1s linear infinite;
            margin-bottom: 1.5rem;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading-progress {
            width: 100%;
            max-width: 400px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-bottom: 1rem;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2196F3, #00BCD4);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .loading-text {
            font-size: 1.1rem;
            color: #2196F3;
            margin-bottom: 0.5rem;
        }

        .loading-subtext {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
        }

        /* Settings Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .settings-modal {
            background: #2d2d2d;
            padding: 2rem;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .settings-modal {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2196F3;
        }

        .close-modal {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close-modal:hover {
            color: white;
        }

        .settings-modal-body {
            padding: 1rem 0;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .settings-input {
            width: 100%;
            padding: 0.8rem;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            margin-bottom: 1rem;
        }

        .settings-input:focus {
            outline: none;
            border-color: #2196F3;
        }

        .btn-save {
            background: #2196F3;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.3s ease;
        }

        .btn-save:hover {
            background: #1976D2;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="nav-buttons">
            <a href="{{ url_for('disease_monitor') }}" class="nav-button">
                <i class="fas fa-camera"></i> Back to Detection
            </a>
            <a href="{{ url_for('history') }}" class="nav-button">
                <i class="fas fa-history"></i> View History
            </a>
            <button class="nav-button" onclick="openSettings()">
                <i class="fas fa-cog"></i> Settings
            </button>
        </div>

        <div class="header">
            <h2>Plant Disease Information</h2>
        </div>
        <div id="detectedObjectInfo" class="detected-object" style="display: none;">
            <strong>Detected Disease:</strong> <span id="objectName"></span>
        </div>

        <!-- Enhanced Loading Animation -->
        <div id="loadingContainer" class="loading-container" style="display: none;">
            <div class="loading-spinner"></div>
            <div class="loading-progress">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <div id="loadingText" class="loading-text">Analyzing disease information...</div>
            <div id="loadingSubtext" class="loading-subtext">Gathering data about causes, symptoms, and treatments</div>
        </div>

        <div id="chatControls" style="display: none;">
            <div class="form-group">
                <input type="text" class="chat-input" id="userInput"
                    placeholder="Ask a question about the detected disease..." />
            </div>
            <button class="btn btn-ask" onclick="sendMessage()">Ask Question</button>
        </div>
        <div id="response"></div>

        <!-- Settings Modal -->
        <div id="settingsModal" class="modal-overlay">
            <div class="settings-modal">
                <div class="modal-header">
                    <div class="modal-title">API Settings</div>
                    <button class="close-modal" onclick="closeSettings()">&times;</button>
                </div>
                <div class="settings-modal-body">
                    <p style="color: rgba(255,255,255,0.7); margin-bottom: 1.5rem;">
                        Please enter your OpenRouter API key. This key will be stored locally in your browser.
                    </p>
                    <div class="form-group">
                        <label for="apiKeyInput">OpenRouter API Key</label>
                        <input type="password" id="apiKeyInput" class="settings-input" placeholder="sk-or-..." />
                    </div>
                    <button class="btn-save" onclick="saveSettings()">Save & Retry</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        // Store the last detected object to prevent duplicate queries
        let lastDetectedObject = null;
        let isProcessing = false;
        let initialQueryCompleted = false;
        let currentDetectionId = null;
        let progressInterval = null;
        let timeoutTimer = null;
        const DEFAULT_API_KEY = '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';

        function getApiKey() {
            return localStorage.getItem('openrouter_api_key') || DEFAULT_API_KEY;
        }

        function openSettings() {
            const modal = document.getElementById('settingsModal');
            const input = document.getElementById('apiKeyInput');
            input.value = localStorage.getItem('openrouter_api_key') || '';
            modal.classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        function saveSettings() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('openrouter_api_key', key);
                closeSettings();

                // Automatically retry if there's a pending query
                const userInput = document.getElementById('userInput').value.trim();
                if (userInput) {
                    sendMessage(userInput);
                } else if (lastDetectedObject) {
                    // Or retry the object query if that was the context
                    queryAboutObject(lastDetectedObject);
                }
            }
        }

        // Check for detected object in localStorage when page loads
        document.addEventListener('DOMContentLoaded', function () {
            // Clear known invalid keys from localStorage to ensure new default is used
            const currentKey = localStorage.getItem('openrouter_api_key');
            const invalidKeys = [
                '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',
                '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'
            ];
            if (invalidKeys.includes(currentKey)) {
                localStorage.removeItem('openrouter_api_key');
                console.log('Removed invalid API key from localStorage');
            }

            const storedObject = localStorage.getItem('detectedObject');
            currentDetectionId = localStorage.getItem('currentDetectionId');

            if (storedObject) {
                handleDetectedObject(storedObject);
                // Clear the stored object after retrieving it
                localStorage.removeItem('detectedObject');
            }
        });

        // Listen for messages from the parent window
        window.addEventListener('message', function (event) {
            if (event.data && event.data.type === 'objectDetected') {
                currentDetectionId = event.data.detectionId;
                handleDetectedObject(event.data.object);
            }
        });

        function handleDetectedObject(detectedObject) {
            if (detectedObject && detectedObject !== lastDetectedObject && !isProcessing) {
                lastDetectedObject = detectedObject;
                document.getElementById('objectName').textContent = detectedObject;
                document.getElementById('detectedObjectInfo').style.display = 'block';

                // Automatically send query about the detected object
                queryAboutObject(detectedObject);
            }
        }

        // Start loading animation with progress bar
        function startLoadingAnimation() {
            const loadingContainer = document.getElementById('loadingContainer');
            const progressBar = document.getElementById('progressBar');
            const loadingText = document.getElementById('loadingText');
            const loadingSubtext = document.getElementById('loadingSubtext');

            loadingContainer.style.display = 'flex';
            progressBar.style.width = '0%';

            let progress = 0;

            // Clear any existing intervals
            if (progressInterval) clearInterval(progressInterval);
            if (timeoutTimer) clearTimeout(timeoutTimer);

            // Start progress animation
            progressInterval = setInterval(() => {
                // Slow down progress as it approaches 90%
                if (progress < 30) {
                    progress += 1;
                } else if (progress < 60) {
                    progress += 0.7;
                } else if (progress < 85) {
                    progress += 0.4;
                } else if (progress < 95) {
                    progress += 0.1;
                }

                // Cap at 95% until complete
                if (progress > 95) {
                    progress = 95;
                    clearInterval(progressInterval);
                }

                progressBar.style.width = `${progress}%`;

                // Update loading text at certain points
                if (progress >= 20 && progress < 40) {
                    loadingText.textContent = "Identifying disease characteristics...";
                    loadingSubtext.textContent = "Analyzing symptoms and visual patterns";
                } else if (progress >= 40 && progress < 60) {
                    loadingText.textContent = "Researching disease information...";
                    loadingSubtext.textContent = "Gathering data about causes and effects";
                } else if (progress >= 60 && progress < 80) {
                    loadingText.textContent = "Compiling treatment options...";
                    loadingSubtext.textContent = "Finding the most effective prevention methods";
                } else if (progress >= 80) {
                    loadingText.textContent = "Finalizing recommendations...";
                    loadingSubtext.textContent = "Preparing personalized advice for your plant";
                }
            }, 100);

            // Set a timeout to stop at 99% if it takes too long
            timeoutTimer = setTimeout(() => {
                if (progressInterval) {
                    clearInterval(progressInterval);
                    progressBar.style.width = '99%';
                    loadingText.textContent = "Almost ready...";
                    loadingSubtext.textContent = "This is taking longer than expected, but we're almost done";
                }
            }, 30000); // 30 seconds timeout
        }

        // Complete loading animation
        function completeLoadingAnimation() {
            const progressBar = document.getElementById('progressBar');
            const loadingContainer = document.getElementById('loadingContainer');

            // Clear any existing intervals and timers
            if (progressInterval) clearInterval(progressInterval);
            if (timeoutTimer) clearTimeout(timeoutTimer);

            // Set to 100%
            progressBar.style.width = '100%';

            // Hide after a short delay
            setTimeout(() => {
                loadingContainer.style.display = 'none';
            }, 500);
        }

        // Local fallback data for common diseases
        const localDiseaseData = {
            "corn gray leaf spot": `
# Corn Gray Leaf Spot

## Causes
**Pathogen:** The disease is caused by the fungus *Cercospora zeae-maydis*.
**Environmental Conditions:** It thrives in warm, humid environments. Specifically, it requires:
*   Temperatures between **75°F and 85°F (24°C - 29°C)**.
*   High relative humidity (**>90%**) for 12 hours or more.
*   Protracted periods of leaf wetness from dew, fog, or rain.
**Source:** The fungus overwinters in infected corn residue (stalks and leaves) left on the soil surface, which releases spores the following season to infect new plants.

## Symptoms
**Early Stages:**
*   Small, necrotic spots appear with a light tan center and possibly a yellow halo.
*   **Key Diagnostic:** When held up to the light, early lesions often show a faint, watery halo.

**Progression:**
*   Lesions elongate into a distinct **rectangular shape**, restricted by the leaf veins.
*   These rectangular spots are gray to tan in color and can grow up to 3-4 inches long.
*   Symptoms typically start on lower leaves and move upward.

**Severe Stages:**
*   Lesions merge (coalesce), destroying large areas of leaf tissue.
*   This leads to premature leaf death (blighting), which reduces photosynthetic capability and can significantly lower grain yield.

## Prevention
**1. Resistant Hybrids:**
*   The most effective prevention is planting corn hybrids with genetic resistance or high tolerance to Gray Leaf Spot. While not immune, they develop fewer and smaller lesions.

**2. Crop Rotation:**
*   Rotate fields with non-host crops (like soybeans) for at least **1-2 years**. This allows the infected corn residue to decompose, reducing the fungal population before corn is planted again.

**3. Tillage (Residue Management):**
*   In fields with a history of severe disease, conventional tillage can help bury infected residue, speeding up decomposition and reducing the initial source of spores. (Note: This must be balanced with soil conservation goals).

## Treatment
**1. Fungicide Application:**
*   **Chemicals:** Fungicides containing **strobilurins** (QoI) or premixes of strobilurins and **triazoles** (DMI) are highly effective.
*   **Timing:** The critical window for application is usually at **VT (tasseling)** to **R1 (silking)**. Early vegetative applications (V4-V10) are generally less effective.

**2. Scouting & Thresholds:**
*   Scout fields shortly before tasseling.
*   **Action Threshold:** Consider treatment if:
    *   50% of plants have lesions on the third leaf below the ear or higher.
    *   Conditions remain warm and humid.
    *   The corn hybrid is susceptible.

**3. Cultural Control:**
*   If irrigation is used, avoid watering during late evening to reduce the duration of leaf wetness overnight.
`
        };

        // CHECK FOR LOCAL DATA FIRST
        function checkLocalData(query, isObjectQuery = false) {
            const normalizedQuery = query.toLowerCase();
            for (const [key, transform] of Object.entries(localDiseaseData)) {
                if (normalizedQuery.includes(key)) {
                    console.log("Using local data for:", key);
                    return { found: true, content: transform, key: key };
                }
            }
            return { found: false };
        }

        async function queryAboutObject(object) {
            isProcessing = true;

            // Start loading animation
            startLoadingAnimation();

            // Check local data first
            const localCheck = checkLocalData(object, true);
            if (localCheck.found) {
                // Simulate API delay for better UX
                setTimeout(() => {
                    const responseDiv = document.getElementById('response');
                    responseDiv.innerHTML = marked.parse(localCheck.content);

                    // Store in history
                    if (currentDetectionId) {
                        updateHistoryWithResponse(localCheck.content);
                    }

                    isProcessing = false;
                    initialQueryCompleted = true;
                    document.getElementById('chatControls').style.display = 'block';
                    completeLoadingAnimation();
                }, 1500);
                return;
            }

            // If not found locally, proceed with API call
            const question = `Tell me about the plant disease "${object}". Explain what causes it, its symptoms, and detailed steps to prevent and treat it. Please format your response with clear sections for Causes, Symptoms, Prevention, and Treatment.`;
            document.getElementById('userInput').value = question;
            await sendMessage(question, true);
            isProcessing = false;
            initialQueryCompleted = true;

            // Show the chat controls after initial query is completed
            document.getElementById('chatControls').style.display = 'block';

            // Complete loading animation
            completeLoadingAnimation();
        }

        async function sendMessage(customInput = null, isInitialQuery = false) {
            const input = customInput || document.getElementById('userInput').value.trim();
            const responseDiv = document.getElementById('response');

            if (!input) {
                responseDiv.innerHTML = '<div class="error">Please enter a question.</div>';
                return;
            }

            responseDiv.innerHTML = '<div class="loading">Processing your question...</div>';

            // Check local data first
            const localCheck = checkLocalData(input);
            if (localCheck.found && !isInitialQuery) {
                // Simulate API delay
                setTimeout(() => {
                    responseDiv.innerHTML = marked.parse(localCheck.content);
                }, 1000);
                return;
            }

            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${getApiKey()}`,
                        'Content-Type': 'application/json',
                        'HTTP-Referer': window.location.href,
                        'X-Title': 'ChatBot'
                    },
                    body: JSON.stringify({
                        model: 'deepseek/deepseek-chat',
                        messages: [{ role: 'user', content: input }],
                        prompt_training: "allow"
                    })
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        openSettings();
                        throw new Error('Invalid API Key. Please enter a valid key in Settings.');
                    }
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || 'API request failed');
                }

                const data = await response.json();
                console.log('API Response:', data);

                if (data.choices && data.choices.length > 0) {
                    const markdownText = data.choices[0].message.content;
                    responseDiv.innerHTML = marked.parse(markdownText);

                    // If this is the initial query, store the information in localStorage
                    if (isInitialQuery && currentDetectionId) {
                        updateHistoryWithResponse(markdownText);
                    }
                } else {
                    responseDiv.innerHTML = '<div class="error">No response received from the API.</div>';
                }
            } catch (error) {
                console.error('Error:', error);
                // Fallback to local data if API fails
                const localFallback = checkLocalData(input);
                if (localFallback.found) {
                    responseDiv.innerHTML = marked.parse(localFallback.content);
                    responseDiv.innerHTML += '<br><small><i>(Offline Mode: Displaying cached information)</i></small>';
                } else {
                    responseDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
                }
            }
        }

        function updateHistoryWithResponse(responseText) {
            // Update the detection record in localStorage
            const detectionHistory = JSON.parse(localStorage.getItem('plantDiseaseHistory') || '[]');
            const detectionIndex = detectionHistory.findIndex(item => item.id === currentDetectionId);

            if (detectionIndex !== -1) {
                // Extract sections from the response
                let information = '';
                let precautions = '';

                // Extract information (first paragraph or Causes/Symptoms section)
                if (responseText.includes('# Causes') || responseText.includes('## Causes')) {
                    const causesMatch = responseText.match(/(?:# |## )Causes([\s\S]*?)(?:# |## |$)/);
                    if (causesMatch && causesMatch[1]) {
                        information = causesMatch[1].trim();
                    }
                } else if (responseText.includes('# Symptoms') || responseText.includes('## Symptoms')) {
                    const symptomsMatch = responseText.match(/(?:# |## )Symptoms([\s\S]*?)(?:# |## |$)/);
                    if (symptomsMatch && symptomsMatch[1]) {
                        information = symptomsMatch[1].trim();
                    }
                } else {
                    // Get first paragraph as information
                    const firstPara = responseText.split('\n\n')[0];
                    information = firstPara.trim();
                }

                // Extract prevention section
                if (responseText.includes('# Prevention') || responseText.includes('## Prevention')) {
                    const preventionMatch = responseText.match(/(?:# |## )Prevention([\s\S]*?)(?:# |## |$)/);
                    if (preventionMatch && preventionMatch[1]) {
                        precautions = preventionMatch[1].trim();
                    }
                } else if (responseText.includes('# Treatment') || responseText.includes('## Treatment')) {
                    const treatmentMatch = responseText.match(/(?:# |## )Treatment([\s\S]*?)(?:# |## |$)/);
                    if (treatmentMatch && treatmentMatch[1]) {
                        precautions = treatmentMatch[1].trim();
                    }
                }

                // Update the record
                detectionHistory[detectionIndex].precautions = precautions || 'No specific precautions available.';
                detectionHistory[detectionIndex].information = information || 'No specific information available.';
                detectionHistory[detectionIndex].fullResponse = responseText;

                // Save back to localStorage
                localStorage.setItem('plantDiseaseHistory', JSON.stringify(detectionHistory));
            }
        }

        // Allow pressing Enter key to send message
        document.getElementById('userInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>

</html>
