<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Predictions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
                        url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: #4a6741;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .back-button:hover {
            background-color: #3d5635;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin-top: 100px;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 50px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .boxes-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .box {
            width: 300px;
            height: 200px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #333;
        }

        .box:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .box i {
            font-size: 3rem;
            color: #4a6741;
            margin-bottom: 15px;
        }

        .box h2 {
            font-size: 1.5rem;
            text-align: center;
            color: #2c3e50;
        }

        @media (max-width: 768px) {
            .boxes-container {
                flex-direction: column;
                align-items: center;
            }
            
            .box {
                width: 90%;
                max-width: 300px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <a href="{{ url_for('home_page') }}" class="back-button">
        <i class="fas fa-arrow-left"></i> Back
    </a>
    
    <div class="container">
        <h1>Crop Advisor</h1>
        
        <div class="boxes-container">
            <a href="{{ url_for('history') }}" class="box" id="see-predictions">
                <i class="fas fa-history"></i>
                <span>See History</span>
            </a>
            <div class="box" id="upload-new">
                <i class="fas fa-upload"></i>
                <span>Upload New</span>
            </div>
            <a href="{{ url_for('what_to_grow') }}" class="box" id="what-to-grow">
                <i class="fas fa-seedling"></i>
                <h2>What to Grow?</h2>
            </a>
        </div>
    </div>
</body>
</html>
