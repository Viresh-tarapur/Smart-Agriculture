    function getRandomGrade() {
  // Static counter to keep track of how many times we've given B, C, D grades
  if (typeof window.gradeCounter === 'undefined') {
    window.gradeCounter = 0;
  }
  
  // If we've given B, C, D grades at least 12 times (4-5 times each on average),
  // then give an A grade and reset the counter
  if (window.gradeCounter >= 12) {
    window.gradeCounter = 0;
    return "A";
  }
  
  // Otherwise, give a random B, C, or D grade and increment the counter
  window.gradeCounter++;
  const grades = ["B", "C", "D"];
  return grades[Math.floor(Math.random() * grades.length)];
}

    function showResult() {

      result.className = `grade-result grade-${grade.replace('+', 'plus')}`;

    function getGradeLabel(grade) {

        te: { "A+": "(అత్యుత్తమం)", "A": "(చాలా మంచి)", "B": "(మంచిది)", "C": "(సగటు)", "D": "(మెరుగుదల అవసరం)" },

    document.getElementById('langToggle').addEventListener('change', function() {
      currentLanguage = this.value;
      updateContent();
      showResult();
    });

    function updateContent() {
      document.querySelectorAll('[data-en]').forEach(element => {
        const translation = element.dataset[currentLanguage] || element.dataset.en;
        element.textContent = translation;
      });
    }

    function updateStaticText() {
      const labels = {
        en: { back: "Back" },
        kn: { back: "ಹಿಂದೆ" },
        te: { back: "వెనక్కి" },
        hi: { back: "वापस" }
      };
      document.querySelector('.back-button span').textContent = labels[currentLanguage].back;
    }

    // Initial content update and result display
    updateContent();

  </script>
